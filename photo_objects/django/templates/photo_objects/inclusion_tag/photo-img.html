{% if photo %}
<img
  src="/img/_uuid/{{ photo.uuid }}/{{ size }}" alt="{{ photo.alt }}"
  style="background: url(data:image/png;base64,{{ photo.tiny_base64 }}); background-size: 100% 100%; font-size: 0;"
  height="{{ height }}"
  width="{{ width }}"
/>
{% else %}
<div class="photo-placeholder"></div>
{% endif %}
