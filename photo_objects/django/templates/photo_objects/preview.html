{% load photo_objects_extras %}

<div class="preview">
  <div class="surface">
    <div class="image">
      {% photo_img preview.photo "sm" thumbnail=True %}
    </div>
    <div class="title-and-description labels">
      <span class="label-primary">{{ preview.title }}</span>
      <p class="label-secondary">{{ preview.description }}</p>
      <span class="host">{{ request.site.domain }}</span>
    </div>
  </div>
  {% if preview.helptext %}
  <span class="helptext">
    {{ preview.helptext }}
  </span>
  {% endif %}
</div>
